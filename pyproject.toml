[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Production-style Hybrid RAG over employment contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-qdrant>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-groq>=0.2.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "pdfplumber>=0.11.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]
eval = ["ragas>=0.2.0", "datasets>=3.0.0"]

[project.scripts]
hybrid-rag = "main:main"
hybrid-rag-eval = "scripts.evaluation.cli:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
package = true
